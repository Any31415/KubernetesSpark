apiVersion: apps/v1
kind: Deployment
metadata:
  name: datamart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datamart
  template:
    metadata:
      labels:
        app: datamart
    spec:
      containers:
        - name: datamart
          image: datamart:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: datamart
spec:
  type: NodePort
  selector:
    app: datamart
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080